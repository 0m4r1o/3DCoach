<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>3D Coach</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>

<!-- =========================
     LANDING / SETUP
========================= -->
<div id="landing">
  <div class="card">

    <!-- Avatar preview -->
    <div class="panel">
      <div class="h1">Choose your avatar</div>
      <div class="sub">Preview, lock, then start.</div>

      <div id="avatarPreviewWrap">
        <canvas id="avatarPreview"></canvas>

        <div class="carouselBar">
          <button id="prevAvatarBtn" class="arrowBtn">◀</button>
          <div id="avatarNamePill">Loading…</div>
          <button id="nextAvatarBtn" class="arrowBtn">▶</button>
          <button id="lockBtn" class="ghost">Lock Avatar</button>
        </div>
      </div>

      <div id="lockState">Not locked</div>
    </div>

    <!-- Workout setup -->
    <div class="panel">
      <div class="h1">Workout setup</div>

      <div style="margin-top:12px;">
        <div class="label">Avatar</div>
        <select id="setupAvatarSelect"></select>
      </div>

      <div style="margin-top:12px;">
        <div class="label">Exercise</div>
        <select id="setupExercise"></select>
      </div>

      <div style="margin-top:12px; display:flex; gap:10px;">
        <div style="flex:1;">
          <div class="label">Target reps</div>
          <input id="targetRepsInput" type="number" min="1" value="12" />
        </div>

        <div style="flex:1;">
          <div class="label">TTS language</div>
          <select id="ttsLang">
            <option value="en" selected>English</option>
            <option value="ar">Arabic</option>
          </select>
        </div>
      </div>

      <div class="btnRow">
        <button id="setupStart" class="primary" disabled>Start</button>
      </div>

      <div class="tip">
        Run servers:<br>
        Frontend: <code>python -m http.server 8000</code><br>
        TTS: <code>python tts_server.py</code>
      </div>
    </div>
  </div>
</div>

<!-- =========================
     MAIN APP
========================= -->
<div id="app">
  <div id="wrap">

    <!-- LEFT: HUD + CAMERA -->
    <div id="left">

      <div id="hud">

        <div class="rowHud">
          <div class="title">3D Coach</div>
          <div class="pill kv">Mode: <span id="modeVal">WORKOUT</span></div>
        </div>

        <div class="rowHud">
          <div class="kv">Exercise</div>
          <select id="exerciseSelect"></select>
        </div>

        <div id="workoutCard">

          <div class="rowHud">
            <div class="kv">Reps</div>
            <div class="pill"><span id="reps">0</span></div>
          </div>

          <div class="rowHud">
            <div class="kv">Target</div>
            <div id="targetPill" class="pill">0 / 12</div>
          </div>

          <div class="rowHud">
            <div class="kv">Phase</div>
            <div id="repState" class="pill">DOWN</div>
          </div>

          <div id="feedback">
            <div id="dot"></div>
            <div id="feedbackText">—</div>
          </div>

          <div id="bar"></div>

          <!-- Buttons EXPECTED by app.js -->
          <div id="btns">
            <button id="resetRepsBtn">Reset reps</button>
            <button id="toggleTTSBtn">TTS: ON</button>
            <button id="backToSetupBtn">Back</button>
          </div>

          <!-- ✅ FIXED: smoothing controls -->
          <label class="hudlab">
            Smoothing
            <input id="smooth" type="range"
                   min="0.05" max="0.6" step="0.05" value="0.25" />
            <span id="smoothVal">0.25</span>
          </label>

          <div class="kv">Mirror: <span id="mirrorVal">ON</span></div>

          <!-- Metrics -->
          <div id="metrics">
            <div class="mItem"><span class="mLabel">Elbow</span><span class="mVal" id="mAngle">—</span></div>
            <div class="mItem"><span class="mLabel">HeightΔ</span><span class="mVal" id="mHeight">—</span></div>
            <div class="mItem"><span class="mLabel">Dx</span><span class="mVal" id="mDx">—</span></div>
            <div class="mItem"><span class="mLabel">Vis</span><span class="mVal" id="mVis">—</span></div>
          </div>

        </div>
      </div>

      <!-- Camera + overlay -->
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <!-- RIGHT: THREE.JS -->
    <div id="right">
      <canvas id="threeCanvas"></canvas>
    </div>

  </div>
</div>

<!-- =========================
     IMPORTS
========================= -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.182.0/examples/jsm/"
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<script type="module" src="./app.js"></script>

</body>
</html>
